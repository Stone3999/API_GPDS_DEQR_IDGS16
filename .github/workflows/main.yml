name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./api
        run: npm ci

      - name: Run Tests and Coverage
        working-directory: ./api
        run: npm run test:cov

      - name: Upload coverage summary
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: ./api/coverage/

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/api-rest:latest
            ${{ secrets.DOCKER_USERNAME }}/api-rest:${{ github.sha }}

  deploy:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Detener el contenedor antiguo si existe
            sudo docker stop api-rest || true
            sudo docker rm api-rest || true
            
            # Descargar la imagen más reciente
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/api-rest:latest
            
            # Levantar la nueva versión mapeada al puerto 80 (sin tiempo de inactividad perceptivo)
            sudo docker run -d --name api-rest -p 80:3000 --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/api-rest:latest
            
            # Limpiar imágenes antiguas (opcional)
            sudo docker image prune -f
